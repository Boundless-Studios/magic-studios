name: Security

# Scans every reachable revision for credentials. Known, reviewed findings live in
# .github/secrets-baseline.json; anything else fails.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all public branches, tags, and retained PR refs
        env:
          GIT_TERMINAL_PROMPT: '0'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git fetch --quiet origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*:refs/remotes/audit-pr/*'
      - name: Install checksum-pinned Gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/studio-gitleaks"
          cd "$RUNNER_TEMP/studio-gitleaks"
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Check every reachable revision and file-content object
        run: python3 scripts/check_secrets.py --gitleaks "$RUNNER_TEMP/studio-gitleaks/gitleaks" --baseline .github/secrets-baseline.json
