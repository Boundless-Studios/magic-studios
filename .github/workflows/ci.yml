name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: magic_video_editor
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d magic_video_editor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[test]"
      # tests/test_worker_update.py installs real wheels with the uv that workers use.
      - run: pip install "uv>=0.5,<1"
      - run: sudo apt-get update
      - run: sudo apt-get install -y ffmpeg
      - run: pytest
        env:
          MAGIC_VIDEO_EDITOR_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/magic_video_editor
      - run: pip install -e "./mcp[test]"
      - run: pytest -q mcp/tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Pick free e2e ports
        run: npm run -s e2e:ports >> "$GITHUB_ENV"
        working-directory: web
      - run: npm run e2e -- studio-flow.spec.ts character-views.spec.ts art-first.spec.ts movie-flow.spec.ts scene-flight.spec.ts launch-policy.spec.ts turnaround-panel.spec.ts
        working-directory: web
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: DOCKER_BUILDKIT=1 docker build --tag magic-video-editor:test .
      - name: Render movie transitions in the shipping runtime
        run: docker run --rm -i --entrypoint python magic-video-editor:test - < scripts/check_movie_transitions.py
