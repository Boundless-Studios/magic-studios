[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-video-editor"
version = "0.1.0"
description = "Standalone video generation and packaging service for Magic Studios"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "asyncpg==0.31.0",
    "cryptography>=46,<51",
    "fastapi==0.128.0",
    "google-cloud-storage==3.9.0",
    "google-cloud-tasks>=2.19,<3",
    "google-auth>=2.38,<3",
    "httpx>=0.28,<0.29",
    "numpy>=2,<3",
    "outbound-gpu-worker-pool[coordinator] @ git+https://github.com/Boundless-Studios/outbound-gpu-worker-pool@54df806bdf2e786673945ae6ec5f0c8890d3bfb1",
    "Pillow>=11,<12",
    "pydantic==2.12.5",
    "sentry-sdk[fastapi]==2.68.1",
    "uvicorn==0.40.0",
]

[project.entry-points."magic_video_editor.targets"]
example = "magic_video_editor.targets.example:create_adapter"

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
magic_video_editor = ["migrations/*.sql", "attach.sh", "attach.ps1", "worker_runner.py", "worker_install.py", "worker_packages/*.whl", "worker_packages/manifest.json", "api.md", "api_reference/static/*", "download_files/*"]
